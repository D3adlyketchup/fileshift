name: Build FileShift.exe

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # also allows manual trigger via GitHub website

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poppler (for PDF → image)
        run: |
          choco install poppler -y
        shell: powershell

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller tkinterdnd2

      - name: Build .exe with PyInstaller
        run: |
          pyinstaller fileshift.spec

      - name: Upload FileShift.exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileShift-Windows
          path: dist/FileShift.exe
          retention-days: 30
